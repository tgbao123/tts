services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - backend_audio:/app/audio_files
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  backend_audio:
