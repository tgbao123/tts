services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    restart: always
    volumes:
      - audio-data:/app/audio_files

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend

volumes:
  audio-data:
